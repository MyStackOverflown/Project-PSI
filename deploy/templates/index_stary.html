<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntetyczny pisarz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}">
</head>
<body class="bg-body-tertiary">

<button id="theme-toggle" class="btn btn-outline-secondary position-fixed top-0 end-0 m-3 z-3 shadow-sm">
    <span id="theme-icon"></span> <span id="theme-text">Ciemny</span>
</button>

<div class="container mt-3">
    <div class="">
        <h2 class="text-center mb-4">Syntetyczny pisarz</h2>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="card-title">Generator stylu G.R.R. Martina</h5>
            <div class="mb-3">
                <input type="text" id="prompt" class="form-control" value="Winter is coming">
            </div>
            <button onclick="generate()" class="btn border shadow-sm">Wygeneruj</button>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div id="result" class="mt-4 p-4 bg-body-tertiary border shadow-sm"></div>
    </div>

</div>

<script>
    async function generate() {
        const prompt = document.getElementById('prompt').value;
        const res = await fetch('/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({prompt: prompt})
        });
        const data = await res.json();
        document.getElementById('result').innerText = data.text;
    }

    document.addEventListener('DOMContentLoaded', () => {
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');
        const htmlElement = document.documentElement; 
        
        const savedTheme = localStorage.getItem('app-theme') || 'light';
        
        applyTheme(savedTheme);

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            applyTheme(newTheme);
        });

        function applyTheme(theme) {
            htmlElement.setAttribute('data-bs-theme', theme);
            
            localStorage.setItem('app-theme', theme);

            if (theme === 'dark') {
                themeText.textContent = 'Jasny';
                themeToggleBtn.classList.replace('btn-outline-secondary', 'btn-outline-light');
            } else {
                themeText.textContent = 'Ciemny';
                themeToggleBtn.classList.replace('btn-outline-light', 'btn-outline-secondary');
            }
        }
    });
</script>

</body>
</html>
