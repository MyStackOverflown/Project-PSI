<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Syntetyczny Pisarz - GRR Martin</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Georgia', serif; }
        .card { background-color: #1e1e1e; border: 1px solid #333; }
        .btn-outline-gold { color: #ffd700; border-color: #ffd700; }
        .btn-outline-gold:hover { background-color: #ffd700; color: #121212; }
        #result { white-space: pre-wrap; font-size: 1.1rem; line-height: 1.6; }
        .text-custom-white { color: #ffffff !important; }
        .form-range::-webkit-slider-runnable-track { background: #333; }
        .form-range::-webkit-slider-thumb { background: #ffd700; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-10">
                <div class="card shadow-lg rounded-3">
                    <div class="card-header border-bottom border-secondary py-3 text-center">
                        <h1 class="h3 mb-0 text-uppercase tracking-wider" style="color: #ffd700;">Syntetyczny Pisarz</h1>
                        <small class="text-custom-white">Generator Stylu George'a R.R. Martina</small>
                    </div>
                    <div class="card-body p-4">
                        <div class="mb-4">
                            <h5 for="prompt" class="form-label text-custom-white mb-3">Prompt:</h5>
                            <input type="text" id="prompt" class="form-control form-control-lg bg-dark text-white border-secondary" value="Winter is coming">
                        </div>

                        <div class="row mb-4">
                            <!--<div class="col-md-6 mb-3 mb-md-0">
                                <label for="temp" class="form-label text-custom-white d-flex justify-content-between">
                                    <span>Temperatura:</span>
                                    <span id="temp-val" class="text-warning fw-bold">0.7</span>
                                </label>
                                <input type="range" id="temp" class="form-range" min="0.1" max="1.5" step="0.1" value="0.7" oninput="updateTempVal(this.value)">
                            </div>-->
                            <div class="col-md-6">
                                <label for="temp-slider" class="form-label text-custom-white">Temperatura:</label>
                                <div class="d-flex align-items-center gap-2">
                                    <input type="range" id="temp-slider" class="form-range" min="0.1" max="1.5" step="0.1" value="0.7" oninput="syncTemp('slider')">
                                    <input type="number" id="temp-input" class="form-control bg-dark text-white border-secondary text-center" style="width: 90px;" min="0" max="1.5" value="0.7" oninput="syncTemp('input')">
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="length-slider" class="form-label text-custom-white">Liczba znaków:</label>
                                <div class="d-flex align-items-center gap-2">
                                    <input type="range" id="length-slider" class="form-range" min="50" max="1500" step="50" value="300" oninput="syncLength('slider')">
                                    <input type="number" id="length-input" class="form-control bg-dark text-white border-secondary text-center" style="width: 90px;" min="0" max="1500" value="300" oninput="syncLength('input')">
                                </div>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button onclick="generate()" class="btn btn-outline-gold btn-lg py-2 fs-5">
                                Generuj
                            </button>
                        </div>
                        
                        <div class="mt-5">
                            <h5 class="text-custom-white mb-3">Opowieść:</h5>
                            <div class="border border-secondary rounded p-4 bg-dark position-relative" style="min-height: 150px;">
                                
                                <div id="loading" class="d-none position-absolute top-50 start-50 translate-middle text-center">
                                    <div class="spinner-border text-warning" role="status" style="width: 3rem; height: 3rem;"></div>
                                    <div class="mt-2 text-custom-white fw-bold">AI pisze...</div>
                                </div>
                                
                                <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>
                                
                                <p id="result" class="text-custom-white mb-0"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    function updateTempVal(val) {
        document.getElementById('temp-val').innerText = val;
    }

    function syncTemp(source) {
        const slider = document.getElementById('temp-slider');
        const input = document.getElementById('temp-input');
        
        if (source === 'slider') {
            input.value = slider.value;
        } else if (source === 'input') {
            let val = parseInt(input.value);
            if (isNaN(val)) val = 0.7;
            if (val < 0.1) val = 0.1;
            if (val > 1.5) val = 1.5;
            slider.value = val;
            input.value = val;
        }
    }

    function syncLength(source) {
        const slider = document.getElementById('length-slider');
        const input = document.getElementById('length-input');
        
        if (source === 'slider') {
            input.value = slider.value;
        } else if (source === 'input') {
            let val = parseInt(input.value);
            if (isNaN(val)) val = 300;
            if (val < 50) val = 50;
            if (val > 1500) val = 1500;
            slider.value = val;
            input.value = val;
        }
    }

    function generate() {
        const promptInput = document.getElementById('prompt').value;
        const tempValue = parseFloat(document.getElementById('temp').value);
        const lengthValue = parseInt(document.getElementById('length-input').value);
        
        const resultParagraph = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');
        const errorAlert = document.getElementById('error-alert');

        resultParagraph.innerText = "";
        errorAlert.classList.add('d-none');
        loadingDiv.classList.remove('d-none');

        fetch('/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ 
                prompt: promptInput,
                temp: tempValue,
                length: lengthValue
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error("Błąd serwera (HTTP " + response.status + ").");
            }
            return response.json();
        })
        .then(data => {
            if (data.error) {
                throw new Error(data.error);
            }
            resultParagraph.innerText = data.text;
        })
        .catch(error => {
            console.error("Szczegóły błędu:", error);
            errorAlert.innerText = error.message || "Wystąpił nieoczekiwany błąd sieciowy.";
            errorAlert.classList.remove('d-none');
        })
        .finally(() => {
            loadingDiv.classList.add('d-none');
        });
    }
    </script>
</body>
</html>
